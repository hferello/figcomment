<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comment Sort</title>
    <style>
      body { margin: 0; font-family: Inter, system-ui, sans-serif; color: #111827; }
      .container { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
      h1 { margin: 0; font-size: 22px; }
      .muted { color: #4b5563; font-size: 13px; line-height: 1.4; }
      label { font-size: 13px; font-weight: 600; }
      input, select {
        width: 100%; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 8px;
        padding: 10px 12px; font-size: 14px; margin-top: 6px;
      }
      .field { display: flex; flex-direction: column; gap: 6px; }
      button {
        border: none; border-radius: 9999px; padding: 11px 16px; min-height: 42px;
        font-weight: 600; cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .primary { background: #111827; color: #fff; }
      .ghost { background: transparent; color: #374151; }
      .actions { display: grid; grid-template-columns: 1fr; gap: 8px; }
      .status { min-height: 20px; font-size: 13px; color: #4b5563; }
      .error { color: #b91c1c; }
      .success { color: #047857; }
      .link { text-decoration: underline; cursor: pointer; background: none; border: none; padding: 0; color: inherit; font: inherit; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .screen[hidden] { display: none; }
      .disclosure { border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; background: #f9fafb; }
    </style>
  </head>
  <body>
    <div class="container">
      <section id="connect_screen" class="screen">
        <h1>Comment Sort</h1>
        <p class="muted">Connect your plugin token from the Comment Sort profile page.</p>
        <div class="field">
          <label for="plugin_token_input">Plugin token</label>
          <input id="plugin_token_input" type="password" placeholder="fc_…" autocomplete="off" />
          <p class="muted">
            <button class="link" id="open_profile_link" type="button">Open profile to get token</button>
          </p>
        </div>
        <button id="connect_button" class="primary">Continue</button>
        <div id="connect_status_text" class="status"></div>
      </section>

      <section id="analyse_screen" class="screen" hidden>
        <div class="row">
          <h1>Comment Sort</h1>
          <button id="change_token_button" type="button" class="ghost">Change token</button>
        </div>
        <div class="field">
          <label for="file_url_input">Figma file URL</label>
          <input id="file_url_input" type="url" placeholder="https://www.figma.com/design/..." />
        </div>
        <div class="field">
          <label for="sort_method_select">Sort method</label>
          <select id="sort_method_select">
            <option value="heuristic">Keywords (no model key required)</option>
            <option value="ai">AI (uses your saved provider key)</option>
          </select>
        </div>
        <div class="disclosure">
          <p class="muted" id="data_disclosure_text"></p>
          <p class="muted">
            <button class="link" id="open_privacy_link" type="button">Privacy policy</button>
          </p>
        </div>
        <div class="actions">
          <button id="table_button" class="primary" data-output="table">Render table</button>
          <button id="sticky_notes_button" class="primary" data-output="sticky_notes">Render sticky notes</button>
          <button id="csv_button" class="primary" data-output="csv">Export CSV</button>
        </div>
        <div id="status_text" class="status"></div>
      </section>
    </div>
    <script>
      const connect_screen = document.getElementById("connect_screen");
      const analyse_screen = document.getElementById("analyse_screen");
      const plugin_token_input = document.getElementById("plugin_token_input");
      const connect_button = document.getElementById("connect_button");
      const connect_status_text = document.getElementById("connect_status_text");
      const change_token_button = document.getElementById("change_token_button");
      const status_text = document.getElementById("status_text");
      const file_url_input = document.getElementById("file_url_input");
      const sort_method_select = document.getElementById("sort_method_select");
      const data_disclosure_text = document.getElementById("data_disclosure_text");
      const open_profile_link = document.getElementById("open_profile_link");
      const open_privacy_link = document.getElementById("open_privacy_link");
      const action_buttons = Array.from(document.querySelectorAll("[data-output]"));

      let connect_screen_height = 340;
      let analyse_screen_height = 520;

      function postPluginMessage(message) {
        parent.postMessage({ pluginMessage: message }, "*");
      }

      function setDisclosure() {
        if (sort_method_select.value === "ai") {
          data_disclosure_text.textContent =
            "AI mode sends redacted comment text to your selected model provider through the Comment Sort backend. Billing is your own provider account.";
        } else {
          data_disclosure_text.textContent =
            "Keyword mode sends comments to Comment Sort only. No model provider key is required.";
        }
      }

      function showConnectScreen() {
        connect_screen.hidden = false;
        analyse_screen.hidden = true;
        postPluginMessage({ type: "resize_ui", height: connect_screen_height });
      }

      function showAnalyseScreen() {
        connect_screen.hidden = true;
        analyse_screen.hidden = false;
        postPluginMessage({ type: "resize_ui", height: analyse_screen_height });
      }

      function persistSettings() {
        postPluginMessage({
          type: "save_settings",
          file_url: file_url_input.value.trim(),
          sort_method: sort_method_select.value,
        });
      }

      connect_button.addEventListener("click", () => {
        const plugin_token = plugin_token_input.value.trim();
        if (!plugin_token) {
          connect_status_text.textContent = "Paste your plugin token.";
          connect_status_text.className = "status error";
          return;
        }
        connect_status_text.textContent = "Verifying token...";
        connect_status_text.className = "status";
        postPluginMessage({ type: "save_token", plugin_token });
      });

      change_token_button.addEventListener("click", () => {
        postPluginMessage({ type: "clear_token" });
      });

      file_url_input.addEventListener("change", persistSettings);
      sort_method_select.addEventListener("change", () => {
        setDisclosure();
        persistSettings();
      });

      open_profile_link.addEventListener("click", () => {
        postPluginMessage({ type: "open_external", href: "https://comment-sort.vercel.app/profile" });
      });

      open_privacy_link.addEventListener("click", () => {
        postPluginMessage({ type: "open_external", href: "https://comment-sort.vercel.app/privacy" });
      });

      action_buttons.forEach((button) => {
        button.addEventListener("click", () => {
          const output_format = button.dataset.output;
          persistSettings();
          status_text.textContent = "Starting analysis...";
          status_text.className = "status";
          action_buttons.forEach((item) => (item.disabled = true));
          postPluginMessage({ type: "run_analysis", output_format });
        });
      });

      window.onmessage = (event) => {
        const plugin_message = event.data.pluginMessage;
        if (!plugin_message || typeof plugin_message !== "object") {
          return;
        }

        if (plugin_message.type === "auth_state") {
          if (typeof plugin_message.file_url === "string") {
            file_url_input.value = plugin_message.file_url;
          }
          if (
            plugin_message.sort_method === "heuristic" ||
            plugin_message.sort_method === "ai"
          ) {
            sort_method_select.value = plugin_message.sort_method;
          }
          setDisclosure();
          if (plugin_message.connected) {
            showAnalyseScreen();
          } else {
            showConnectScreen();
          }
        }

        if (plugin_message.type === "connect_error") {
          connect_status_text.textContent = plugin_message.message;
          connect_status_text.className = "status error";
        }

        if (plugin_message.type === "connect_success") {
          connect_status_text.textContent = "Connected.";
          connect_status_text.className = "status success";
          showAnalyseScreen();
        }

        if (plugin_message.type === "status") {
          status_text.textContent = plugin_message.message;
          status_text.className = "status";
        }

        if (plugin_message.type === "error") {
          status_text.textContent = plugin_message.message;
          status_text.className = "status error";
          action_buttons.forEach((item) => (item.disabled = false));
        }

        if (plugin_message.type === "complete") {
          status_text.textContent = plugin_message.message;
          status_text.className = "status success";
          action_buttons.forEach((item) => (item.disabled = false));
        }

        if (plugin_message.type === "download_csv") {
          const blob = new Blob([plugin_message.csv], { type: "text/csv;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = plugin_message.filename;
          link.click();
          URL.revokeObjectURL(url);
        }
      };

      setDisclosure();
    </script>
  </body>
</html>
