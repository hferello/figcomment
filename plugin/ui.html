<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Figcomment</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, system-ui, -apple-system, sans-serif;
      }

      body {
        margin: 0;
        padding: 18px;
      }

      .container {
        display: flex;
        flex-direction: column;
      }

      .screen {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .screen[hidden] {
        display: none;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-mark {
        flex-shrink: 0;
        display: block;
        width: 36px;
        height: 36px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
      }

      p {
        margin: 0;
        font-size: 16px;
        line-height: 1.4;
        color: #5f6670;
      }

      .intro {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-top: -8px;
        margin-bottom: 8px;
      }

      .tagline {
        font-size: 18px;
        font-weight: 600;
        line-height: 1.3;
        color: #111827;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 600;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #c8cdd3;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14px;
        font-family: inherit;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field-help {
        font-size: 13px;
        line-height: 1.45;
        color: #5f6670;
      }

      .connect-actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 4px;
      }

      button {
        border: none;
        border-radius: 8px;
        padding: 10px 12px;
        font-weight: 600;
        cursor: pointer;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .action-button {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: flex-start;
        width: 100%;
      }

      .action-button svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .primary {
        background: #0f62fe;
        color: white;
        font-size: 16px;
      }

      .secondary {
        background: transparent;
        color: #5f6670;
        font-size: 14px;
        font-weight: 500;
        padding: 6px 0;
        text-align: left;
      }

      .status {
        min-height: 20px;
        font-size: 16px;
      }

      .connect-status {
        min-height: 20px;
        font-size: 14px;
      }

      .error {
        color: #b00020;
      }

      .success {
        color: #0f7b3a;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <section id="connect_screen" class="screen">
        <div class="brand">
          <h1>Figcomment</h1>
        </div>

        <div class="intro">
          <p class="tagline">Make sense of the noise.</p>
          <p>Analyse and sort Figma comments with AI.</p>
        </div>



        <div class="field">
          <label for="plugin_token_input">Plugin token</label>
          <input
            id="plugin_token_input"
            type="password"
            autocomplete="off"
            spellcheck="false"
            placeholder="fc_…"
          />
          <p class="field-help">
            Paste your plugin token from your account to connect this Figma plugin. <a href="http://figcomment.vercel.app/" target="_blank">Get your token</a>
          </p>
        </div>

        <div class="connect-actions">
          <button id="connect_button" class="primary">Continue</button>
          <div id="connect_status_text" class="connect-status"></div>
        </div>
      </section>

      <section id="analyse_screen" class="screen" hidden>
        <div class="brand">
          <h1>Figcomment</h1>
        </div>
        <p>Analyse and sort feedback. Outputs:</p>
        <div class="actions">
          <button
            id="table_button"
            class="primary action-button"
            data-output="table"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14" />
              <path d="M3 10h18" />
              <path d="M10 3v18" />
            </svg>
            <span>Table</span>
          </button>
          <button
            id="sticky_notes_button"
            class="primary action-button"
            data-output="sticky_notes"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M6 4h12a2 2 0 0 1 2 2v7h-5a2 2 0 0 0 -2 2v5h-7a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2" />
              <path d="M20 13v.172a2 2 0 0 1 -.586 1.414l-4.828 4.828a2 2 0 0 1 -1.414 .586h-.172" />
            </svg>
            <span>Sticky notes</span>
          </button>
          <button
            id="csv_button"
            class="primary action-button"
            data-output="csv"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M14 3v4a1 1 0 0 0 1 1h4" />
              <path d="M5 12v-7a2 2 0 0 1 2 -2h7l5 5v4" />
              <path d="M7 16.5a1.5 1.5 0 0 0 -3 0v3a1.5 1.5 0 0 0 3 0" />
              <path d="M10 20.25c0 .414 .336 .75 .75 .75h1.25a1 1 0 0 0 1 -1v-1a1 1 0 0 0 -1 -1h-1a1 1 0 0 1 -1 -1v-1a1 1 0 0 1 1 -1h1.25a.75 .75 0 0 1 .75 .75" />
              <path d="M16 15l2 6l2 -6" />
            </svg>
            <span>CSV</span>
          </button>
        </div>
        <button id="change_token_button" class="secondary" type="button">
          Change token
        </button>
        <div id="status_text" class="status"></div>
      </section>
    </div>

<template id="brand_logo_template">

    <script>
      function mountBrandLogo(brand, index) {
        const brand_logo_template = document.getElementById("brand_logo_template");
        if (!brand_logo_template) {
          return;
        }

        const clone = brand_logo_template.content.cloneNode(true);
        const id_map = new Map();

        clone.querySelectorAll("[id]").forEach((element) => {
          const next_id = `${element.id}_${index}`;
          id_map.set(element.id, next_id);
          element.id = next_id;
        });

        clone.querySelectorAll("*").forEach((element) => {
          for (const attr of ["mask", "fill", "stroke", "href", "xlink:href"]) {
            const value = element.getAttribute(attr);
            if (!value) {
              continue;
            }

            const updated = value.replace(/url\(#([^)]+)\)/g, (_, id) => {
              const mapped = id_map.get(id);
              return mapped ? `url(#${mapped})` : value;
            });

            if (updated !== value) {
              element.setAttribute(attr, updated);
            }
          }
        });

        brand.insertBefore(clone, brand.firstChild);
      }

      document.querySelectorAll(".brand").forEach((brand, index) => {
        mountBrandLogo(brand, index);
      });

      const connect_screen = document.getElementById("connect_screen");
      const analyse_screen = document.getElementById("analyse_screen");
      const plugin_token_input = document.getElementById("plugin_token_input");
      const connect_button = document.getElementById("connect_button");
      const connect_status_text = document.getElementById("connect_status_text");
      const change_token_button = document.getElementById("change_token_button");
      const action_buttons = Array.from(
        document.querySelectorAll(".action-button"),
      );
      const status_text = document.getElementById("status_text");

      if (
        !connect_screen ||
        !analyse_screen ||
        !plugin_token_input ||
        !connect_button ||
        !connect_status_text ||
        !change_token_button ||
        action_buttons.length === 0 ||
        !status_text
      ) {
        throw new Error("Required UI elements are missing.");
      }

      function showConnectScreen() {
        connect_screen.hidden = false;
        analyse_screen.hidden = true;
        parent.postMessage(
          {
            pluginMessage: {
              type: "resize_ui",
              height: 360,
            },
          },
          "*",
        );
      }

      function showAnalyseScreen() {
        connect_screen.hidden = true;
        analyse_screen.hidden = false;
        parent.postMessage(
          {
            pluginMessage: {
              type: "resize_ui",
              height: 320,
            },
          },
          "*",
        );
      }

      function setConnectDisabled(disabled) {
        connect_button.disabled = disabled;
        plugin_token_input.disabled = disabled;
      }

      function setActionButtonsDisabled(disabled) {
        action_buttons.forEach((button) => {
          button.disabled = disabled;
        });
      }

      connect_button.addEventListener("click", () => {
        const plugin_token = plugin_token_input.value.trim();
        if (!plugin_token) {
          connect_status_text.textContent = "Paste your plugin token to continue.";
          connect_status_text.classList.add("error");
          connect_status_text.classList.remove("success");
          return;
        }

        setConnectDisabled(true);
        connect_status_text.textContent = "Verifying token...";
        connect_status_text.classList.remove("error", "success");

        parent.postMessage(
          {
            pluginMessage: {
              type: "save_token",
              plugin_token,
            },
          },
          "*",
        );
      });

      change_token_button.addEventListener("click", () => {
        parent.postMessage(
          {
            pluginMessage: {
              type: "clear_token",
            },
          },
          "*",
        );
      });

      action_buttons.forEach((button) => {
        button.addEventListener("click", () => {
          const output_format = button.dataset.output;
          if (!output_format) {
            return;
          }

          setActionButtonsDisabled(true);
          status_text.textContent = "Starting analysis...";
          status_text.classList.remove("error");

          parent.postMessage(
            {
              pluginMessage: {
                type: "run_analysis",
                output_format,
              },
            },
            "*",
          );
        });
      });

      window.onmessage = (event) => {
        const plugin_message = event.data.pluginMessage;
        if (!plugin_message || typeof plugin_message !== "object") {
          return;
        }

        if (plugin_message.type === "auth_state") {
          if (plugin_message.connected) {
            showAnalyseScreen();
          } else {
            showConnectScreen();
          }
        }

        if (plugin_message.type === "connect_error") {
          connect_status_text.textContent = plugin_message.message;
          connect_status_text.classList.add("error");
          connect_status_text.classList.remove("success");
          setConnectDisabled(false);
        }

        if (plugin_message.type === "connect_success") {
          const prefix =
            typeof plugin_message.prefix === "string"
              ? plugin_message.prefix
              : "token";
          connect_status_text.textContent = `Connected (${prefix}…).`;
          connect_status_text.classList.add("success");
          connect_status_text.classList.remove("error");
          setConnectDisabled(false);
          showAnalyseScreen();
        }

        if (plugin_message.type === "status") {
          status_text.textContent = plugin_message.message;
          status_text.classList.remove("error");
        }

        if (plugin_message.type === "error") {
          status_text.textContent = plugin_message.message;
          status_text.classList.add("error");
          setActionButtonsDisabled(false);
        }

        if (plugin_message.type === "complete") {
          status_text.textContent = plugin_message.message;
          status_text.classList.remove("error");
          setActionButtonsDisabled(false);
        }

        if (plugin_message.type === "download_csv") {
          if (
            typeof plugin_message.csv !== "string" ||
            typeof plugin_message.filename !== "string"
          ) {
            return;
          }

          const blob = new Blob([plugin_message.csv], {
            type: "text/csv;charset=utf-8;",
          });
          const download_url = URL.createObjectURL(blob);
          const download_link = document.createElement("a");
          download_link.href = download_url;
          download_link.download = plugin_message.filename;
          download_link.click();
          URL.revokeObjectURL(download_url);
        }
      };
    </script>
  </body>
</html>
